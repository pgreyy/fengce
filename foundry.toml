[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./sdk/src/tiers.json" }, { access = "read", path = "./sdk/quotes" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@safe/=lib/safe-smart-account/contracts/",
    "@fengce/core/=src/core/",
    "@fengce/safe/=src/safe/",
]

# FengceGuard is compiled with the IR pipeline to stay under the 24,576-byte contract size limit.
additional_compiler_profiles = [{ name = "ir", via_ir = true }]
compilation_restrictions = [{ paths = "src/safe/FengceGuard.sol", via_ir = true }]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech" # official; https://xlayerrpc.okx.com is the other OKX endpoint
# Read-only source of Safe7579 bytecode for the ERC-7579 fork test (not deployed on X Layer).
base = "https://mainnet.base.org"
