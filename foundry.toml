[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@safe/=lib/safe-smart-account/contracts/",
    "@fengce/core/=src/core/",
    "@fengce/safe/=src/safe/",
]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
