[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./sdk/src/tiers.json" }, { access = "read", path = "./sdk/quotes" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@safe/=lib/safe-smart-account/contracts/",
    "@fengce/core/=src/core/",
    "@fengce/safe/=src/safe/",
]

[rpc_endpoints]
xlayer = "https://xlayerrpc.okx.com" # official OKX endpoint; https://rpc.xlayer.tech is the other one
# Read-only source of Safe7579 bytecode for the ERC-7579 fork test (not deployed on X Layer).
base = "https://mainnet.base.org"
