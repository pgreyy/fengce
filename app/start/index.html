<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Get started · Fengce</title>
    <meta name="description" content="Connect a browser wallet, choose or create a Safe on X Layer, and install your limits with one signature." />
    <meta property="og:title" content="Get started · Fengce" />
    <meta property="og:description" content="Connect a browser wallet, choose or create a Safe on X Layer, and install your limits with one signature." />
    <script>
      /* Theme before first paint: the saved choice, else the system's. */
      (function () {
        var t = null; try { t = localStorage.getItem("fengce-theme") || localStorage.getItem("okun-theme"); } catch (e) {} if (!t && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t = "light"; if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/pages/start.tsx"></script>
  </body>
</html>
