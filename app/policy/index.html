<!doctype html>
<html lang="en" data-theme="dark-cobalt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Fengce · Policy</title>
    <meta name="description" content="Every transaction, from you or your AI agent, is checked against a TapeOut circuit on X Layer. Break the rule and it doesn&#39;t go through." />
    <script>
      /* Theme before first paint: saved choice, else the system preference; dark when nothing is known. */
      (function () {
        var t = null;
        try { t = localStorage.getItem("fengce-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t === "light" ? "light-cobalt" : "dark-cobalt");
      })();
      /* Entrance and scroll animations only for people: not for automated or headless browsers (screenshot and preview
         tools must see the finished page), and not with reduced motion. Content is fully visible without this class. */
      (function () {
        try {
          var bot = navigator.webdriver || /HeadlessChrome|Headless|Lighthouse|bot|crawl|spider|screenshot|preview/i.test(navigator.userAgent);
          var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!bot && !reduce) document.documentElement.classList.add("anim");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/pages/policy.tsx"></script>
  </body>
</html>
