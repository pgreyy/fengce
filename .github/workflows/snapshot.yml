name: Refresh event snapshot

# Daily (and on demand): extends app/public/events-snapshot.json to a recent block, commits it if it changed, and
# redeploys the static app to Vercel production, so pages only scan the blocks since the last run.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XLAYER_RPC: ${{ secrets.XLAYER_RPC_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          cd sdk && npm ci
          cd ../app && npm ci
      - name: Extend the snapshot
        run: cd app && npm run snapshot
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- app/public/events-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add app/public/events-snapshot.json
          git commit -m "App: refresh event snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: |
          cd app
          npm run build
          node scripts/build-vercel.mjs
      - name: Deploy to Vercel production
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        run: npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Vercel token missing
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set; the snapshot was committed but not deployed."
